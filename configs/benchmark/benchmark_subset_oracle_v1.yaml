selection:
  methods:
    - future_selected_routing_mass
    - future_binary_count
    - previous_route
    - static_frequency
  qwen_additional_methods: [future_full_router_mass]
  exact_cardinality: true
  tie_break: ascending_layer_scoped_expert_id
  previous_route_history: previous_realized_window_same_horizon
  previous_route_first_window: static_frequency
  static_frequency_source: v17_disjoint_wikitext_default_vector_counts
transfer_model:
  timing_kind: simulated_not_measured_runtime
  bandwidth_gib_per_second: 25.0
  fixed_latency_microseconds_per_load: 10.0
  resident_capacity: exact_budget_per_layer
  window_prefetch: load_new_subset_members_at_boundary
  fallback: transient_load_each_missing_natural_expert_per_layer_token
  reference: natural_on_demand_transient_native_selected_experts
  shared_experts: excluded_from_routed_budget_and_transfer
open_loop:
  raw_format: csv_gzip
  aggregate_statistics: [mean, median, p05, p95, worst]
  stratify_by: [model, task, layer, context_bucket, router_margin_bucket]
  context_buckets: [0-31, 32-63, 64-127]
  router_margin_buckets: per_model_task_layer_tertiles
  worst_case_count_per_model_task_metric: 100
operating_point_selection:
  hard_oracle_method: future_selected_routing_mass
  require_every_task_before_selection: true
  maximum_points_per_model: 1
  exclude_all_expert_budget: true
  maximum_resident_fraction: 0.75
  minimum_mean_route_hit: 0.90
  minimum_mean_selected_routing_mass: 0.95
  minimum_p05_route_hit: 0.80
  minimum_worst_route_hit: 0.80
  minimum_transfer_reduction: 0.30
  minimum_selected_mass_improvement_over_best_baseline: 0.05
  maximum_lossless_fallback_frequency: 0.10
  deterministic_order:
    - lowest_resident_fraction
    - lowest_worst_task_estimated_h2d_bytes_per_token
    - highest_worst_task_route_hit
    - highest_horizon
    - lowest_budget
closed_loop:
  smoke_rows:
    humaneval: HumanEval/0
    mbpp_plus: "2"
    gsm8k: test-0
    aime24: train-0
    aime25: test-0
    strategyqa: 7a0e419ffb6009156828
  smoke_max_new_tokens: 8
  full_sample_scope: all_v17_rows
  policies:
    - natural_v17_reuse
    - lossless_oracle_residency
    - hard_oracle_commitment
    - previous_route_commitment
  oracle_future: natural_rollout_from_current_policy_boundary_state
  cache_semantics: rewind_natural_lookahead_then_replay_policy_window
  hard_mask_semantics: mask_outside_subset_before_native_topk_and_native_renormalization
  decode_semantics: exact_v17_per_model_task_settings
  sample_shards: 4
  max_concurrent_workers_per_physical_gpu: 1
  atomic_unit: one_sample_policy_row
  aime_gpt_max_new_tokens: 32768
  metrics:
    - task_correct
    - exact_token_agreement
    - first_token_divergence
    - first_route_divergence
    - vanilla_token_nll_on_policy_context
    - perplexity
    - fallback_frequency
    - route_coverage
    - transfer_bytes
    - subset_churn
    - simulated_exposed_stall
    - measured_runtime
paired_accuracy_gate:
  definition: >
    hard successes must be at least vanilla successes minus allowed_drop_questions;
    allowed_drop_questions is frozen as ceil(2*sqrt(N*p_vanilla*(1-p_vanilla))),
    with a minimum of one question
  confidence_interval: paired_difference_normal_95
  require_each_task: true
  vanilla:
    qwen3_30b_a3b:
      humaneval: {successes: 154, samples: 164, allowed_drop_questions: 7}
      mbpp_plus: {successes: 289, samples: 378, allowed_drop_questions: 17}
      gsm8k: {successes: 1245, samples: 1319, allowed_drop_questions: 17}
      aime24: {successes: 22, samples: 30, allowed_drop_questions: 5}
      aime25: {successes: 20, samples: 30, allowed_drop_questions: 6}
      strategyqa: {successes: 488, samples: 687, allowed_drop_questions: 24}
    gpt_oss_20b:
      humaneval: {successes: 158, samples: 164, allowed_drop_questions: 5}
      mbpp_plus: {successes: 287, samples: 378, allowed_drop_questions: 17}
      gsm8k: {successes: 1242, samples: 1319, allowed_drop_questions: 18}
      aime24: {successes: 19, samples: 30, allowed_drop_questions: 6}
      aime25: {successes: 19, samples: 30, allowed_drop_questions: 6}
      strategyqa: {successes: 513, samples: 687, allowed_drop_questions: 23}
decision:
  labels: [GO, NARROW, STOP/PIVOT]
  per_model_task_point: true
  no_macro_average_override: true
  predictor_authorization: only_all_task_GO_or_explicit_task_scoped_NARROW
  perfect_oracle_failure_action: stop_predictor_training
