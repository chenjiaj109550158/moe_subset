[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pseudoroute-moe"
version = "0.1.0"
description = "Research framework for position-conditioned MoE routing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "safetensors>=0.4,<1",
  "numpy>=1.26,<2.4",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

hf = [
  "accelerate>=1.14,<2",
  "datasets>=3,<5",
  "huggingface-hub>=0.26,<2",
  "kernels>=0.15.2,<0.16",
  "psutil>=7.2,<8",
  "transformers>=4.45,<6",
]

[project.scripts]
pseudoroute = "pseudoroute.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pseudoroute"]
artifacts = ["src/pseudoroute/py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/spec", "pseudoroute_moe_project_spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pseudoroute"]

